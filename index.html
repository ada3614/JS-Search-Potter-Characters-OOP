<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Search Potter Characters</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="title">Search Characters from Potter Books</h1>
        <div class="input-wrapper">
          <input class="input" type="text" />
          <button class="searchBtn">Search</button>
        </div>
      </header>
      <main>
        <div class="list-wrapper">
          <div class="list-item">
            <img
              class="list-item-img"
              src="./Fleamont_Potter.webp"
              alt="person-img"
            />
            <h3 class="list-hero-name">Harry Potter</h3>
            <h3 class="list-hero-house">Gryffindor</h3>
          </div>
        </div>
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
